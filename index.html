<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#eaf2e8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1a17" media="(prefers-color-scheme: dark)" />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Fonts are same-origin, but are still fetched in CORS mode: without
         crossorigin the browser downloads each preloaded file a second time. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/fonts/fraunces-latin-600-normal-v1.woff2"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/fonts/dm-mono-latin-400-normal-v1.woff2"
    />

    <title>{{SITE_TITLE}}</title>
    <meta name="description" content="{{SITE_DESCRIPTION}}" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="{{SITE_TITLE}}" />
    <meta property="og:description" content="{{SITE_DESCRIPTION}}" />
    <meta property="og:url" content="https://deepakchapagain.com/" />
    <meta property="og:image" content="https://deepakchapagain.com/og-image.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{SITE_TITLE}}" />
    <meta name="twitter:description" content="{{SITE_DESCRIPTION}}" />
    <meta name="twitter:image" content="https://deepakchapagain.com/og-image.png" />

    <script>
      // Mirrors getInitialTheme in useTheme.ts. An explicit 'light' is truthy,
      // so a stored choice always wins over the OS preference.
      try {
        const stored = localStorage.getItem('theme')
        const dark =
          stored === 'dark' ||
          (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
      } catch {
        // Ignore
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
